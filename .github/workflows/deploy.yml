name: Deploy to EC2

# main 브랜치에 push되면 자동 실행 + Actions 탭에서 수동 실행도 가능
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 21 설치 (+ Maven 의존성 캐시로 빌드 속도 향상)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # 3. 빌드
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # 4. jar 파일을 EC2로 전송 (/home/jihun/libs/)
      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/message-project-0.0.1-SNAPSHOT.jar
          target: /home/jihun/libs/
          strip_components: 1   # target/ 폴더 경로를 떼고 파일만 전송

      # 5. 앱 재시작 + 헬스체크로 배포 검증
      - name: Restart & health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/jihun
            ./killall.sh
            ./Start.sh
            echo "앱 기동 대기 중..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz > /dev/null; then
                echo "배포 성공 - 헬스체크 통과"
                exit 0
              fi
            done
            echo "헬스체크 실패 - 최근 로그:"
            tail -n 50 logs/app.log
            exit 1