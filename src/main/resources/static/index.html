<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 메시지 발송 시스템</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: #f4f6f9; margin: 0; padding: 24px; color: #222; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: #555; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  textarea { resize: vertical; min-height: 70px; }
  button { margin-top: 14px; padding: 10px 22px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #fafafa; color: #666; }
  .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .PENDING { background: #fef3c7; color: #92400e; }
  .SENDING { background: #dbeafe; color: #1e40af; }
  .SENT    { background: #dcfce7; color: #166534; }
  .FAILED  { background: #fee2e2; color: #991b1b; }
  .meta { font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📨 미니 메시지 발송 시스템</h1>

  <div class="card">
    <label for="receiver">수신 번호</label>
    <input id="receiver" placeholder="010-1234-5678">
    <label for="content">메시지 내용</label>
    <textarea id="content" placeholder="보낼 내용을 입력하세요"></textarea>
    <button onclick="sendMessage()">발송 요청</button>
    <button onclick="sendBulk()" style="background:#059669">테스트 10건 한번에 발송</button>
    <span id="result" class="meta"></span>
  </div>

  <div class="card">
    <div class="meta" style="margin-bottom:8px">대기열: <b id="queueSize">0</b>건 · 2초마다 자동 새로고침</div>
    <table>
      <thead>
        <tr><th>ID</th><th>수신번호</th><th>내용</th><th>상태</th><th>처리 워커</th><th>접수</th><th>완료</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
</div>

<script>
async function sendMessage() {
  const receiver = document.getElementById('receiver').value.trim();
  const content = document.getElementById('content').value.trim();
  const res = await fetch('/api/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ receiver, content })
  });
  document.getElementById('result').textContent = res.ok ? ' ✅ 접수 완료' : ' ❌ 입력값을 확인하세요';
  refresh();
}

// 멀티쓰레드 동작을 눈으로 확인하기 위한 대량 발송 테스트
async function sendBulk() {
  for (let i = 1; i <= 10; i++) {
    await fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ receiver: '010-0000-' + String(i).padStart(4, '0'), content: '대량 테스트 ' + i })
    });
  }
  refresh();
}

function fmt(t) { return t ? t.replace('T', ' ').substring(5, 19) : '-'; }

async function refresh() {
  const [msgs, q] = await Promise.all([
    fetch('/api/messages').then(r => r.json()),
    fetch('/api/queue/status').then(r => r.json())
  ]);
  document.getElementById('queueSize').textContent = q.waiting;
  document.getElementById('list').innerHTML = msgs.map(m => `
    <tr>
      <td>${m.id}</td>
      <td>${m.receiver}</td>
      <td>${m.content}</td>
      <td><span class="badge ${m.status}">${m.status}</span></td>
      <td>${m.workerName ?? '-'}</td>
      <td>${fmt(m.createdAt)}</td>
      <td>${fmt(m.sentAt)}</td>
    </tr>`).join('');
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
