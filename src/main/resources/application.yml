server:
  # 환경변수 SERVER_PORT가 있으면 그 값을, 없으면 8081 사용
  # (로컬은 8080이 WSL에 이미 배정되어 있어 8081을 기본값으로 사용)
  # 실행 시 임시로 바꾸고 싶으면: java -jar app.jar --server.port=9090
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: message-project

  datasource:
    # 인메모리 H2 → 앱을 끄면 데이터가 사라짐 (학습용)
    # 다음 단계에서 이 부분을 AWS RDS(MySQL) 접속 정보로 교체 예정
    url: jdbc:h2:mem:messagedb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console   # 브라우저에서 DB를 직접 볼 수 있는 콘솔

  jpa:
    hibernate:
      ddl-auto: update    # 엔티티 기준으로 테이블 자동 생성
    show-sql: false

app:
  worker:
    count: 3              # 발송 워커 쓰레드 개수
    send-delay-ms: 1000   # 발송 시뮬레이션 소요 시간(ms)
    max-retry: 2          # 발송 실패 시 자동 재시도 횟수 (총 시도 = 1 + max-retry)
